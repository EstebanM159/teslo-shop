<div class="card bg-base-100 shadow-sm animate-fadeIn">
  <figure>
    <img [src]='product().images |productImage' [alt]="product().slug" loading="lazy" />
  </figure>
  <div class="card-body">
    <h2 class="card-title font-outfit text-accent text-lg hover:underline cursor-pointer"
      [routerLink]="['/product',product().slug]">{{product().title}}</h2>
    <p>{{product().description | slice:0:70}}...</p>
    <div class="card-actions justify-end">
      <a [routerLink]="['/product',product().slug]" class="link link-accent">Ver producto</a>
    </div>
  </div>
</div>
