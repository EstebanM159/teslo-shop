<h1 class="text-2xl font-outfit">Seccion de {{gender()|appGender}}</h1>
@if(productsResource.isLoading()){
<div class="flex justify-center items-center h-screen">
  <span class="loading loading-bars loading-xl"></span>
</div>
}
@if(productsResource.error()){
<h1>Ha ocurrido un error</h1>
}


@if (productsResource.hasValue()) {
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-5 ">
  @for (product of productsResource.value().products; track $index) {
  <product-card [product]="product" />
  }
  <!-- Empty -->
  @empty {
  <p>No hay productos</p>
  }
</div>
}
<shared-pagination [currentPage]="this.paginationService.currentPage()"
  [pages]="productsResource.value()?.pages ?? 0" />
