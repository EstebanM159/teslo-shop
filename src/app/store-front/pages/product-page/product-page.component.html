@if(productResource.isLoading()){
<div class="flex justify-center items-center h-screen">
  <span class="loading loading-spinner loading-lg"></span>
</div>
}
<!-- Producto -->
@if (productResource.hasValue()) {
<!-- <img [src]="productResource.value().images | productImage" alt=""> -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-10">
  <product-carousel [images]="productResource.value().images " />
  <div>
    <h2 class="text-2xl font-bold font-outfit">{{productResource.value().title}}</h2>
    <div class="divider"></div>
    <p>{{productResource.value().description}}</p>
  </div>
</div>
}
